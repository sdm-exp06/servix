<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --text: #f5f5f7;
      --muted: #8b8e98;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      position: relative;
    }

    /* Background glow */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
    }

    body::before {
      background: var(--accent);
      top: -220px;
      left: -180px;
    }

    body::after {
      background: var(--accent-2);
      right: -200px;
      bottom: -250px;
    }

    /* Subtle grid */
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(900px, 90%);
      text-align: center;
      padding: 40px 20px;
    }

    .code {
      font-size: clamp(130px, 25vw, 280px);
      line-height: .8;
      font-weight: 900;
      letter-spacing: -0.08em;

      background: linear-gradient(
        135deg,
        #ffffff 10%,
        #aaa3ff 45%,
        #00d4ff 90%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 80px rgba(124, 92, 255, .18);

      animation: float 5s ease-in-out infinite;
    }

    .title {
      margin-top: 45px;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .description {
      max-width: 520px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .button {
      text-decoration: none;
      color: white;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 650;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), #5d42e8);
      box-shadow: 0 10px 35px rgba(124, 92, 255, .25);
    }

    .secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .primary:hover {
      box-shadow: 0 15px 45px rgba(124, 92, 255, .4);
    }

    .secondary:hover {
      background: rgba(255,255,255,.1);
    }

    .hint {
      margin-top: 38px;
      font-size: 13px;
      color: #5f626c;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      animation: drift linear infinite;
      pointer-events: none;
    }

    .particle:nth-child(1) {
      left: 12%;
      top: 25%;
      animation-duration: 8s;
    }

    .particle:nth-child(2) {
      left: 82%;
      top: 20%;
      animation-duration: 11s;
    }

    .particle:nth-child(3) {
      left: 72%;
      top: 75%;
      animation-duration: 9s;
    }

    .particle:nth-child(4) {
      left: 22%;
      top: 80%;
      animation-duration: 13s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0);
        opacity: .2;
      }
      50% {
        transform: translate(20px, -30px);
        opacity: .8;
      }
      100% {
        transform: translate(-10px, -60px);
        opacity: .1;
      }
    }

    @media (max-width: 500px) {
      .title {
        margin-top: 35px;
      }

      .description {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="grid"></div>

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <main class="container">

    <div class="code">404</div>

    <h1 class="title">Lost in the void?</h1>

    <p class="description">
      The page you're looking for doesn't exist, was moved,
      or has disappeared into the digital universe.
    </p>

    <div class="actions">
      <a href="/" class="button primary">
        ← Back home
      </a>

      <a href="javascript:history.back()" class="button secondary">
        Go back
      </a>
    </div>

    <p class="hint">
      Error code · HTTP 404 · Page Not Found
    </p>

  </main>

</body>
</html>
